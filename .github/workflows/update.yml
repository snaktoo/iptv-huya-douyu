name: Update IPTV Playlist
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install requests
          pip install ykdl
      - name: Create output dir
        run: mkdir -p /tmp/iptv_update/cctv_sources
      - name: Pre-download CCTV sources
        run: |
          curl -sL --retry 3 'https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_cctv.m3u8' -o /tmp/iptv_update/cctv_sources/bestfan.m3u
          curl -sL --retry 3 'https://raw.githubusercontent.com/cs3306/IPTV-Sources/main/data/output/iptv_collection.m3u' -o /tmp/iptv_update/cctv_sources/cs3306_IPTV-Sources.m3u
          curl -sL --retry 3 'https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u' -o /tmp/iptv_update/cctv_sources/BurningC4.m3u
      - name: Fetch Huya
        run: python scripts/fetch_huya.py
      - name: Fetch Douyu
        run: python scripts/fetch_douyu.py
      - name: Generate M3U
        run: python scripts/merge_m3u.py
      - name: Copy M3U
        run: |
          if [ -f /tmp/iptv_update/huya_douyu_movie.m3u ]; then
            cp /tmp/iptv_update/huya_douyu_movie.m3u huya_douyu_movie.m3u
          fi
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huya_douyu_movie.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update $(date +%s)"
          git push
